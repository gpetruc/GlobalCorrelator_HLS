# Prototype for subsystem-agnostic CI templates
# NOTE: Will be moved to a common repo very soon


.vivado_base:
  tags:
    - vivado20192
  before_script:
    - source /opt/Xilinx/Vivado/${VIVADO_VERSION}/settings64.sh
    - cd ${WORKDIR}
  artifacts:
    paths:
      - ${WORKDIR}/**/*.txt
      - ${WORKDIR}/**/*.log
    when: always
    expire_in: 7 days


.vivado_hls_csim:
  extends:
    - .vivado_base
  stage: pre-build
  script:
    - vivado_hls -f $(echo ${VIVADO_HLS_TCL_SCRIPT} | envsubst)
  after_script:
    - 'mv -v ${WORKDIR}/vivado_hls.log ${WORKDIR}/vivado_hls.$(echo ${VIVADO_HLS_LOG_ID} | envsubst).log'
  artifacts:
    paths:
      - ${WORKDIR}/vivado_hls.${VIVADO_HLS_LOG_ID}.log
      - ${WORKDIR}/*/solution/csim/build/*.txt
  needs: []


.vivado_hls_csynth:
  extends:
    - .vivado_base
  stage: build
  when: manual
  allow_failure: false
  script:
    - DO_SYNTH=1 vivado_hls -f $(echo ${VIVADO_HLS_TCL_SCRIPT} | envsubst)
  after_script:
    - mv -v ${WORKDIR}/vivado_hls.log ${WORKDIR}/vivado_hls.$(echo ${VIVADO_HLS_LOG_ID} | envsubst).log
  artifacts:
    paths:
      - ${WORKDIR}/vivado_hls.${VIVADO_HLS_LOG_ID}.log
      - ${WORKDIR}/*/solution/csim/build/*.txt
      - ${WORKDIR}/*/solution/syn/report/
      - ${WORKDIR}/*/solution/impl/vhdl/
  needs: []
