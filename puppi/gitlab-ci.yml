
.puppi-hls-common:
  variables:
    WORKDIR: puppi
  parallel:
    matrix:
      - puppiReg: [Barrel, HGCal]
        VIVADO_HLS_TCL_SCRIPT: run_hls_linpuppi_tracker.tcl
      - puppiReg: [HGCalNoTK, HF]
        VIVADO_HLS_TCL_SCRIPT: run_hls_linpuppi_forward.tcl


hls-csim:puppi:
  extends:
    - .vivado_hls_csim
    - .puppi-hls-common
  variables:
    puppiBoard: none
    VIVADO_HLS_LOG_ID: linpuppi-$${puppiReg}-csim


hls-csynth:puppi:
  extends:
    - .vivado_hls_csynth
    - .puppi-hls-common
  variables:
    puppiBoard: VCU118
    VIVADO_HLS_LOG_ID: linpuppi-$${puppiReg}-csynth
