
.linpuppi-hls-common:
  variables:
    VIVADO_HLS_LOG_ID: linpuppi-$${puppiReg}
    WORKDIR: puppi
  parallel:
    matrix:
      - puppiReg: [Barrel, HGCal]
        VIVADO_HLS_TCL_SCRIPT: run_hls_linpuppi_tracker.tcl
      - puppiReg: [HGCalNoTK, HF]
        VIVADO_HLS_TCL_SCRIPT: run_hls_linpuppi_forward.tcl


puppi:csim:
  extends:
    - .vivado_hls_csim
    - .linpuppi-hls-common
  tags: [ vivado20192-csim ]
  variables:
    puppiBoard: none


puppi:csynth:
  extends:
    - .vivado_hls_csynth
    - .linpuppi-hls-common
  variables:
    puppiBoard: VCU118




.puppiSort-hls-common:
  variables:
    puppiReg: HGCal
    VIVADO_HLS_LOG_ID: puppiSort-hybrid-HGCal
    VIVADO_HLS_TCL_SCRIPT: run_hls_puppi_sort.tcl
    WORKDIR: puppi


puppiSort:csim:
  tags: [ vivado20192-csim ]
  extends:
    - .vivado_hls_csim
    - .puppiSort-hls-common


puppiSort:csynth:
  extends:
    - .vivado_hls_csynth
    - .puppiSort-hls-common
  variables:
    sortAlgo: hybrid
