.puppi-common: 
  tags: [ vivado20192 ]
  before_script:
    - source /opt/Xilinx/Vivado/2019.2/settings64.sh
    - cd puppi
  after_script:
    - mv puppi/vivado_hls.log puppi/vivado_hls.${CI_JOB_NAME}.txt
  artifacts:
    when: always
    expire_in: 7 days
  only:
    refs: [ branches, tags, merge_request, web, schedules ]
    changes:
      - "*"
      - dataformats/**/*
      - data/**/*
      - pf/**/*
      - puppi/**/*
      - utils/**/*
      - common/**/*

.puppi-csim-common:
  tags: [ vivado20192-small ]
  extends: .puppi-common
  stage: pre-build
  variables: 
    puppiBoard: none
  artifacts:
    paths:
      - puppi/vivado_hls.${CI_JOB_NAME}.txt
      - puppi/proj_linpuppi_${puppiReg}_${puppiBoard}/solution/csim/build/*.txt

.puppi-csynth-common: 
  extends: .puppi-common
  stage: build
  when: manual
  variables:
    puppiBoard: VCU118
    DO_SYNTH: 1
  artifacts:
    paths:
      - puppi/vivado_hls.${CI_JOB_NAME}.txt
      - puppi/proj_linpuppi_${puppiReg}_${puppiBoard}/solution/csim/build/*.txt
      - puppi/proj_linpuppi_${puppiReg}_${puppiBoard}/solution/syn/report/*
      - puppi/proj_linpuppi_${puppiReg}_${puppiBoard}/solution/impl/vhdl/*
  only:
    refs: [ branches, tags, merge_request, web, schedules ]
    changes:
      - dataformats/**/*
      - puppi/*
      - puppi/firmware/*
      - common/firmware/*
  dependencies: 


linpuppi-Barrel-csim:
  extends: .puppi-csim-common
  variables:
    puppiReg: Barrel
  script:
    - vivado_hls -f run_hls_linpuppi_tracker.tcl

linpuppi-HGCal-csim:
  extends: .puppi-csim-common
