
include:
  - project: cms-cactus/phase2/firmware/ci-templates
    ref: 3775e01a
    file: vivado/all.yml
  - /pf/gitlab-ci.yml
  - /puppi/gitlab-ci.yml
  - /l1-regionizer/multififo/gitlab-ci.yml


default:
  tags: [vivado20192]

variables:
  VIVADO_VERSION: '2019.2'


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    # - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # - if: $CI_COMMIT_BRANCH =~ /^test/
    - if: $CI_COMMIT_BRANCH
    

stages:
  - sim
  - pre-build
  - build
  - test
  - deploy
