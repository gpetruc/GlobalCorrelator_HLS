.pf-common: &pf-common
  tags: [ vivado20192 ]
  before_script:
    - source /opt/Xilinx/Vivado/2019.2/settings64.sh
    - cd pf
  after_script:
    - mv pf/vivado_hls.log pf/vivado_hls.${CI_JOB_NAME}.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - pf/vivado_hls.${CI_JOB_NAME}.txt

.pf-csim-common: &pf-csim-common
  <<: *pf-common
  stage: pre-build
  variables:
    pfBoard: none
  artifacts:
    paths:
      - pf/proj_pf${pfReg}_${pfBoard}/solution/csim/build/*.txt

.pf-csynth-common: &pf-csynth-common
  <<: *pf-common
  stage: build
  when: manual
  variables:
    pfBoard: VCU118
    DO_SYNTH: 1
  after_script:
    - mv pf/vivado_hls.log pf/vivado_hls.${CI_JOB_NAME}.txt
    - tar czf pf/${CI_JOB_NAME}.reports.tar.gz pf/proj_pf${pfReg}_${pfBoard}/solution/synth/report
    - tar czf pf/${CI_JOB_NAME}.impl.tar.gz pf/proj_pf${pfReg}_${pfBoard}/solution/impl/vhdl
  artifacts:
    paths:
      - pf/proj_pf${pfReg}_${pfBoard}/solution/synth/report
      - pf/${CI_JOB_NAME}.reports.tar.gz
      - pf/${CI_JOB_NAME}.impl.tar.gz


csim-pfalgo3:
  <<: *pf-csim-common
  variables:
    pfReg: Barrel
  script:
    - vivado_hls -f run_hls_pfalgo3.tcl


csim-pfalgo2hgc:
  <<: *csim-common
  variables:
    pfReg: HGCal
  script:
    - vivado_hls -f run_hls_pfalgo2hgcal.tcl

csynth-pfalgo3:
  <<: *pf-csynth-common
  variables:
    pfReg: Barrel
  script:
    - vivado_hls -f run_hls_pfalgo3.tcl


csynth-pfalgo2hgc:
  <<: *csynth-common
  variables:
    pfReg: HGCal
  script:
    - vivado_hls -f run_hls_pfalgo2hgcal.tcl
