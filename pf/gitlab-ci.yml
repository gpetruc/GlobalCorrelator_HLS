.pf-common: &pf-common
  tags: [ vivado20192 ]
  before_script:
    - source /opt/Xilinx/Vivado/2019.2/settings64.sh
    - cd pf
  after_script:
    - mv pf/vivado_hls.log pf/vivado_hls.${CI_JOB_NAME}.txt
  artifacts:
    when: always
    expire_in: 7 days
  only:
    changes:
      - "*"
      - dataformats/**/*
      - data/**/*
      - pf/**/*
      - utils/**/*

.pf-csim-common: &pf-csim-common
  <<: *pf-common
  stage: pre-build
  artifacts:
    paths:
      - pf/vivado_hls.${CI_JOB_NAME}.txt
      - pf/proj_pf${pfReg}_${pfBoard}/solution/csim/build/*.txt

.pf-csim-variables: &pf-csim-variables
    pfBoard: none

.pf-csynth-common: &pf-csynth-common
  <<: *pf-common
  stage: build
  when: manual
  artifacts:
    paths:
      - pf/vivado_hls.${CI_JOB_NAME}.txt
      - pf/proj_pf${pfReg}_${pfBoard}/solution/csim/build/*.txt
      - pf/proj_pf${pfReg}_${pfBoard}/solution/syn/report/*
      - pf/proj_pf${pfReg}_${pfBoard}/solution/impl/vhdl/*
  dependencies: 

.pf-csynth-variables: &pf-csynth-variables
    pfBoard: VCU118
    DO_SYNTH: 1

   
pfalgo3-csim:
  <<: *pf-csim-common
  variables:
    <<: *pf-csim-variables
    pfReg: Barrel
  script:
    - vivado_hls -f run_hls_pfalgo3.tcl

pfalgo2hgc-csim:
  <<: *pf-csim-common
  variables:
    <<: *pf-csim-variables
    pfReg: HGCal
  script:
    - vivado_hls -f run_hls_pfalgo2hgc.tcl

pfalgo3-csynth:
  <<: *pf-csynth-common
  variables:
    <<: *pf-csynth-variables
    pfReg: Barrel
  script:
    - vivado_hls -f run_hls_pfalgo3.tcl

pfalgo2hgc-csynth:
  <<: *pf-csynth-common
  variables:
    <<: *pf-csynth-variables
    pfReg: HGCal
  script:
    - vivado_hls -f run_hls_pfalgo2hgc.tcl
