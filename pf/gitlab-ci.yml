
hls-csim:pf:
  extends: .vivado_hls_csim
  variables:
    WORKDIR: pf
    pfBoard: none
  parallel:
    matrix:
      - pfReg: Barrel
        VIVADO_HLS_TCL_SCRIPT: run_hls_pfalgo3.tcl
        VIVADO_HLS_LOG_ID: pfalgo3-csim
      - pfReg: HGCal
        VIVADO_HLS_TCL_SCRIPT: run_hls_pfalgo2hgc.tcl
        VIVADO_HLS_LOG_ID: pfalgo2hgc-csim


hls-csynth:pf:
  extends: .vivado_hls_csynth
  variables:
    WORKDIR: pf
    pfBoard: VCU118
  parallel:
    matrix:
      - pfReg: Barrel
        VIVADO_HLS_TCL_SCRIPT: run_hls_pfalgo3.tcl
        VIVADO_HLS_LOG_ID: pfalgo3-csynth
      - pfReg: HGCal
        VIVADO_HLS_TCL_SCRIPT: run_hls_pfalgo2hgc.tcl
        VIVADO_HLS_LOG_ID: pfalgo2hgc-csynth
